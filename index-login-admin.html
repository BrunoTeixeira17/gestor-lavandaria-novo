<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestor de Lavandarias</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#172033}
header{background:#0f172a;color:#fff;padding:20px}header h1{margin:0;font-size:24px}
main{max-width:1000px;margin:30px auto;padding:0 16px}
.card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 3px 14px #0001;margin-bottom:20px}
.login{max-width:460px;margin:70px auto}.hidden{display:none}
label{display:block;font-weight:700;margin:12px 0 6px}
input,button{width:100%;padding:12px;border-radius:8px;font-size:16px}
input{border:1px solid #cbd5e1}button{border:0;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;margin-top:16px}
button.secondary{background:#475569}.error{color:#b91c1c;margin-top:12px}.success{color:#15803d;margin-top:12px}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#dcfce7;color:#166534;font-size:13px;font-weight:700}
table{width:100%;border-collapse:collapse;margin-top:15px}th,td{text-align:left;padding:11px;border-bottom:1px solid #e2e8f0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{background:#f8fafc;padding:18px;border-radius:10px}.stat strong{display:block;font-size:25px;margin-top:7px}
@media(max-width:700px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>Gestor de Lavandarias</h1></header>

<main>
  <section id="loginView" class="card login">
    <h2>Entrar</h2>
    <p>Primeiro teste de autenticação.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" placeholder="Email">
    <label for="password">Palavra-passe</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Palavra-passe">
    <button id="loginBtn">Entrar</button>
    <div id="loginMessage"></div>
  </section>

  <section id="adminView" class="hidden">
    <div class="card">
      <span class="badge">ADMINISTRADOR</span>
      <h2>Área de Administração</h2>
      <p id="adminEmail"></p>
      <button id="logoutBtn" class="secondary">Sair</button>
    </div>

    <div class="card">
      <h2>Resumo</h2>
      <div class="stats">
        <div class="stat">Clientes<strong id="clientCount">0</strong></div>
        <div class="stat">Lavandarias<strong id="laundryCount">0</strong></div>
        <div class="stat">Estado<strong>Ativo</strong></div>
      </div>
    </div>

    <div class="card">
      <h2>Próxima etapa</h2>
      <p>Aqui vamos acrescentar a gestão de clientes e, depois, a faturação separada por lavandaria.</p>
    </div>
  </section>
</main>

<script>
const ADMIN_EMAIL = "brunoteixeira1208@gmail.com";
const ADMIN_PASSWORD = "bteixeira17";
const SESSION_KEY = "gestor_lavandarias_admin_session";

const loginView=document.getElementById("loginView");
const adminView=document.getElementById("adminView");
const email=document.getElementById("email");
const password=document.getElementById("password");
const message=document.getElementById("loginMessage");

function showAdmin(){
  loginView.classList.add("hidden");
  adminView.classList.remove("hidden");
  document.getElementById("adminEmail").textContent=ADMIN_EMAIL;
}
function showLogin(){
  adminView.classList.add("hidden");
  loginView.classList.remove("hidden");
  email.value="";password.value="";
}
document.getElementById("loginBtn").onclick=()=>{
  message.className="";
  if(email.value.trim().toLowerCase()===ADMIN_EMAIL &&
     password.value===ADMIN_PASSWORD){
    sessionStorage.setItem(SESSION_KEY,"1");
    message.textContent="";
    showAdmin();
  }else{
    message.className="error";
    message.textContent="Email ou palavra-passe incorretos.";
  }
};
document.getElementById("logoutBtn").onclick=()=>{
  sessionStorage.removeItem(SESSION_KEY);
  showLogin();
};
password.addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("loginBtn").click()});
if(sessionStorage.getItem(SESSION_KEY)==="1")showAdmin();
</script>
</body>
</html>
